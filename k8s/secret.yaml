# TEMPLATE ONLY — do not commit real secrets.
# Use sealed-secrets, external-secrets, or vault in production.
apiVersion: v1
kind: Secret
metadata:
  name: fastapi-secret
type: Opaque
stringData:
  SECRET_KEY: "replace-with-a-strong-secret-key-minimum-32-chars!!"
  DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/fastapi_db"
  DATABASE_URL_READER: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres-replica:5432/fastapi_db"
  CELERY_BROKER_URL: "redis://redis:6379/2"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
