<table class="w-full bg-white shadow rounded">
    <thead>
        <tr class="bg-gray-200 text-left">
            {% for col in columns %}
            <th class="p-3">{{ col }}</th>
            {% endfor %}
            <th class="p-3">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr class="border-t hover:bg-gray-50">
            {% for col in columns %}
            <td class="p-3">{{ row[col] }}</td>
            {% endfor %}
            <td class="p-3 space-x-2">
                <a href="/admin/{{ table_name }}/{{ row.id }}" class="text-blue-600 hover:underline">View</a>
                <a href="/admin/{{ table_name }}/{{ row.id }}/edit" class="text-yellow-600 hover:underline">Edit</a>
                <a href="#"
                   hx-post="/admin/{{ table_name }}/{{ row.id }}/delete"
                   hx-confirm="Are you sure you want to delete this record?"
                   class="text-red-600 hover:underline cursor-pointer">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
