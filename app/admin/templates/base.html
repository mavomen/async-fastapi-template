<!doctype html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8" />
    <title>Admin – {{ user.username }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <script>
        (function() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && prefersDark)) {
                document.documentElement.classList.add('dark');
                document.documentElement.style.backgroundColor = '#1a202c';
            }
            window.toggleTheme = function() {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            };
        })();
    </script>
    <style>
        .dark .bg-white { background-color: #2d3748 !important; }
        .dark .bg-gray-100 { background-color: #1a202c !important; }
        .dark .bg-gray-200 { background-color: #4a5568 !important; }
        .dark .text-gray-500 { color: #a0aec0 !important; }
    </style>
</head>
<body class="bg-gray-100" hx-ext="sse,ws">
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <nav class="bg-white shadow p-4 flex justify-between">
        <div class="flex space-x-6">
            <a href="/admin" class="font-bold text-xl">Admin</a>
            <a href="/admin" class="hover:text-blue-600">Dashboard</a>
            <a href="/docs" class="hover:text-blue-600">API Docs</a>
            <button onclick="toggleTheme()" class="hover:text-blue-600">🌓</button>
        </div>
        <div>
            <span class="mr-4">{{ user.email }}</span>
            <a href="/api/v1/auth/login" class="text-red-600 hover:underline">Logout</a>
        </div>
    </nav>

    <main class="container mx-auto mt-8 px-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
