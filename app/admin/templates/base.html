<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin – {{ user.username }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100">
    <nav class="bg-white shadow p-4 flex justify-between">
      <div class="flex space-x-6">
        <a href="/admin" class="font-bold text-xl">Admin</a>
        <a href="/admin" class="hover:text-blue-600">Dashboard</a>
        <a href="/docs" class="hover:text-blue-600">API Docs</a>
      </div>
      <div>
        <span class="mr-4">{{ user.email }}</span>
        <a href="/api/v1/auth/login" class="text-red-600 hover:underline"
          >Logout</a
        >
      </div>
    </nav>
    <main class="container mx-auto mt-8 px-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
