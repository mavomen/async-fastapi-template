{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl mb-6">
  {% if editing %}Edit{% else %}Create{% endif %}
  {{ obj.__class__.__name__ if obj else '' }}
</h1>

<div class="bg-white shadow rounded p-6">
  <form
    method="post"
    action="{% if editing %}/admin/{{ table_name }}/{{ obj.id }}/edit{% else %}/admin/{{ table_name }}/create{% endif %}"
    class="space-y-4"
    hx-boost="true"
  >
    {% for field in fields %}
    <div>
      <label class="block font-bold mb-1">{{ field }}</label>
      <input
        type="text"
        name="{{ field }}"
        value="{{ obj[field] if obj else '' }}"
        class="border p-2 rounded w-full"
      />
    </div>
    {% endfor %}

    <div class="space-x-2">
      <button
        type="submit"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
      >
        Save
      </button>
      <a
        href="/admin/{{ table_name }}"
        class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400"
      >
        Cancel
      </a>
    </div>
  </form>
</div>

<!-- Toast container (appears after successful save) -->
<div id="toast-container" class="hidden fixed top-4 right-4 z-50 space-y-2"></div>
{% endblock %}
