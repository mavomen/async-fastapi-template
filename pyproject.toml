[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.12"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.6"
pydantic-settings = "^2.7.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.49"}
asyncpg = "^0.30.0"
alembic = "^1.14.1"
redis = {extras = ["hiredis"], version = "^7.4.0"}
celery = "^5.4.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.20"
orjson = "^3.10.14"
email-validator = "^2.3.0"
bcrypt = "^5.0.0"
greenlet = "^3.5.0"
slowapi = "^0.1.9"
aiofiles = "^25.1.0"
aioboto3 = "^15.5.0"
websockets = "^16.0"
structlog = "^25.5.0"
python-json-logger = "^4.1.0"
prometheus-client = "^0.25.0"
prometheus-fastapi-instrumentator = "^7.1.0"
opentelemetry-api = "^1.41.1"
opentelemetry-sdk = "^1.41.1"
opentelemetry-instrumentation-fastapi = "^0.62b1"
opentelemetry-instrumentation-sqlalchemy = "^0.62b1"
opentelemetry-exporter-otlp = "^1.41.1"
jinja2 = "^3.1.6"
openpyxl = "^3.1.5"
strawberry-graphql = {extras = ["asgi", "fastapi"], version = "^0.315.3"}
kafka-python = "^2.3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.1"
ruff = "^0.9.1"
mypy = "^1.14.1"
pre-commit = "^4.0.1"
pytest-mock = "^3.15.1"
faker = "^40.15.0"
pytest-benchmark = "^5.2.3"
locust = "^2.43.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=80"

# ----- ruff (lint + format) -----
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T10", "DJ",
    "EM", "ISC", "ICN", "G", "PIE", "T20", "Q", "RSE", "RET", "SIM",
    "TID", "ARG", "PTH", "PD", "PL", "TRY", "NPY", "RUF",
]
ignore = [
    "E501", "TRY003", "EM101", "EM102",
    "B008", "ARG001", "PLR2004",          # FastAPI deps and test constants
    "RET504", "TRY300", "B904", "B017",   # minor style
    "N818", "A005", "RUF005", "RUF012", "RUF013", "RUF003",
    "G004", "DTZ003", "SIM118", "SIM101", "SIM108", "SIM117",
    "A002",                               # shadowing builtins (id)
    "F841", "F821",                        # forward refs handled by __future__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "PLR2004", "B017"]
"alembic/env.py" = ["E402"]
"scripts/*.py" = ["T201", "PLR0912", "PLR0915"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ----- mypy (relaxed strictness) -----
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
exclude = ["alembic/", "tests/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "passlib.*", "jose.*", "redis.*", "aioboto3.*", "aiofiles.*",
    "celery.*", "slowapi.*", "opentelemetry.*", "prometheus_client.*",
    "prometheus_fastapi_instrumentator.*", "pythonjsonlogger.*", "structlog.*",
    "sqlalchemy.*", "asyncpg.*", "orjson.*", "email_validator.*",
]
ignore_missing_imports = true
