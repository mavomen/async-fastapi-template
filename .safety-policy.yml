# Safety dependency-scan policy.
#
# Known-debt advisory ignore list. The free Safety tier has no CVSS severity
# data (filtering by severity requires a paid account), so rows are ignored by
# explicit vulnerability ID. Every entry below is tracked and requires a
# coordinated dependency upgrade to clear (major bump to Pillow 12.x, Starlette
# >=1.x which needs a FastAPI major bump, strawberry-graphql >0.315.6, pytest 9.x,
# plus transitive python-engineio/python-socketio/pyasn1/ecdsa). See TODO.md
# "Dependency security debt".
security:
  ignore-vulnerabilities:
