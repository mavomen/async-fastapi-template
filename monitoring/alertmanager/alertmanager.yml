global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "warning"
      repeat_interval: 4h

receivers:
  - name: "default"
    webhook_configs:
      - url: "${SLACK_WEBHOOK_URL:-http://localhost:9095}"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "${SLACK_WEBHOOK_URL:-http://localhost:9095}"
        send_resolved: true
    pagerduty_configs:
      - service_key: "${PAGERDUTY_KEY:-}"
        description: "{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}"
        severity: "{{ .GroupLabels.severity }}"

  - name: "warning"
    webhook_configs:
      - url: "${SLACK_WEBHOOK_URL:-http://localhost:9095}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
