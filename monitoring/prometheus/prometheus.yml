global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/rules/slo.yml"
  - "/etc/prometheus/rules/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "fastapi"
    static_configs:
      - targets: ["app:8000"]
