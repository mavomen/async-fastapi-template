repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        description: Run the project's mypy (strict) on app/ via the poetry environment
        entry: poetry run mypy app/
        language: system
        pass_filenames: false
        require_serial: true
      - id: poetry-check
        name: poetry check
        description: Validate pyproject.toml and poetry.lock consistency
        entry: poetry check --lock
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^tests/contract/__snapshots__/'
      - id: end-of-file-fixer
        exclude: '^tests/contract/__snapshots__/'
      - id: check-yaml
        exclude: '^helm/'
      - id: check-json
      - id: detect-private-key
  - repo: https://github.com/PyCQA/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        args: [--require-hashes=false]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml', '-r', 'app/']
        pass_filenames: false
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^tests/|^\.secrets\.baseline$'
