repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        description: Run the project's mypy (strict) on app/ via the poetry environment
        entry: poetry run mypy app/
        language: system
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^tests/contract/__snapshots__/'
      - id: end-of-file-fixer
        exclude: '^tests/contract/__snapshots__/'
      - id: check-yaml
        exclude: '^helm/'
      - id: check-json
      - id: detect-private-key
