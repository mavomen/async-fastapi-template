replicaCount: 3

image:
  repository: ghcr.io/mavomen/async-fastapi-template
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: fastapi.example.com
  tls: true
  clusterIssuer: letsencrypt-prod

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

pdb:
  enabled: true
  minAvailable: 2

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

terminationGracePeriodSeconds: 45

config:
  ENVIRONMENT: "production"
  REDIS_URL: "redis://redis:6379/0"
  API_V1_STR: "/api/v1"
  STORAGE_BACKEND: "local"
  LOCAL_STORAGE_PATH: "/data/uploads"

secret:
  SECRET_KEY: "replace-me"
  DATABASE_URL: "postgresql+asyncpg://postgres:changeme@postgres:5432/fastapi_db"
  DATABASE_URL_READER: ""
  POSTGRES_PASSWORD: "changeme"
  CELERY_BROKER_URL: "redis://redis:6379/2"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
