name: "Setup Python with Poetry and caching"
description: "Composite action to set up Python, install Poetry, cache dependencies, and install project deps."
inputs:
  python-version:
    description: "Python version to use"
    default: "3.12"
  install-args:
    description: "Extra arguments to pass to poetry install"
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      run: pip install poetry
      shell: bash

    - name: Cache Poetry virtualenv
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry/virtualenvs
        key: poetry-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          poetry-${{ runner.os }}-${{ inputs.python-version }}-

    - name: Install dependencies
      run: poetry install --no-interaction ${{ inputs.install-args }}
      shell: bash
