name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastapi_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          echo "=== START TESTS ==="
          echo "Python version: $(python --version)"
          echo "Poetry version: $(poetry --version)"
          export SECRET_KEY="${TEST_SECRET_KEY:-ci-test-key-minimum-32-characters!!}"
          echo "SECRET_KEY length: ${#SECRET_KEY}"
          poetry run python -c "from app.core.config import settings; print('Settings loaded OK')"
          poetry run pytest -v --cov=app --cov-report=xml 2>&1 | tee pytest_output.txt
          echo "=== TESTS DONE ==="
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml

  smoke:
    name: CI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
      - name: Verify CI boots
        run: |
          echo "Python version: $(python --version)"
          echo "Poetry version: $(poetry --version)"
          echo "CI bootstrapped successfully"

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
      - name: Run benchmarks
        env:
          ENVIRONMENT: test
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'ci-test-key-minimum-32-characters!!' }}
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastapi_test
          REDIS_URL: redis://localhost:6379/0
        run: poetry run pytest benchmarks/ --benchmark-only --benchmark-json=benchmark.json
      - name: Compare with baseline
        run: poetry run python scripts/compare_benchmarks.py benchmark.json
      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmarks/baseline.json
