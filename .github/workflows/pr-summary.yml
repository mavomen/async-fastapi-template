name: PR Summary

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  summary:
    name: Post PR Summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to settle
        run: sleep 30

      - name: Collect CI results
        id: collect
        run: |
          # Gather check runs for this PR's HEAD SHA
          SHA="${{ github.event.pull_request.head.sha }}"
          RUNS=$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs" \
            --jq '[.check_runs[] | {name: .name, status: .conclusion}]')
          echo "runs=${RUNS}" >> "$GITHUB_OUTPUT"

          # Collect coverage from test job if available
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&per_page=5" \
            --jq '[.workflow_runs[] | select(.name == "Test") | .id] | first // empty')
          echo "test_run_id=${ARTIFACTS}" >> "$GITHUB_OUTPUT"

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format and post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const runs = JSON.parse(`${{ steps.collect.outputs.runs }}`);

            const statusEmoji = (s) => {
              if (s === 'success') return '✅';
              if (s === 'failure') return '❌';
              if (s === 'cancelled') return '⏭️';
              return '⏳';
            };

            let body = `## CI Summary\n\n`;
            body += `| Gate | Status |\n|------|--------|\n`;

            for (const run of runs) {
              body += `| ${run.name} | ${statusEmoji(run.conclusion)} ${run.conclusion || 'pending'} |\n`;
            }

            body += `\n<sub>Auto-generated by PR Summary workflow</sub>`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## CI Summary';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
