name: Lint

on:
  push:
    branches: [main, hotfix/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          install-args: "--only dev"
      - name: Run Ruff
        run: poetry run ruff check .
